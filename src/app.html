<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--
			`interactive-widget=resizes-content` tells mobile browsers
			to shrink the layout viewport when the on-screen keyboard
			opens. Without it, `position: fixed; bottom: 0` elements
			get pushed BEHIND the keyboard because the layout viewport
			stays at full height while only the visual viewport
			shrinks. With it, the chat compose, bottom nav, etc., float
			just above the keyboard like users expect.
		-->
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<meta name="theme-color" content="#0c0c0c" />
		<!--
			Replay the user's palette BEFORE first paint.

			theme-store.js can only apply the theme once its module has loaded
			and hydration has run, which on a cold start (and every native
			WebView reload) is several hundred ms of the DEFAULT palette from
			app.css. Restoring only the background — the previous version of
			this script — made that worse rather than better: the page got the
			user's dark background while cards stayed cream, text stayed
			near-black and the accent stayed the default red, so the flash was
			three palettes deep instead of one.

			So we replay the whole resolved token set that theme-store wrote on
			its last paint. Runs synchronously in <head>, before <body> exists,
			so there is nothing to see in between. Deliberately placed AFTER the
			theme-color meta above so it can retint the browser chrome too.

			Everything is wrapped in try/catch and every step is independently
			optional: a missing, corrupt or future-versioned snapshot just
			leaves the app.css fallbacks in place, which is exactly the old
			behaviour. Nothing here can break the page.
		-->
		<script>
			(function () {
				try {
					var root = document.documentElement;
					var snap = null;
					try { snap = JSON.parse(localStorage.getItem('theme-boot') || 'null'); } catch (e) {}

					var dark = null;
					var surface = null;

					if (snap && snap.v === 1 && snap.tokens) {
						var t = snap.tokens;
						for (var k in t) {
							if (Object.prototype.hasOwnProperty.call(t, k)) root.style.setProperty(k, t[k]);
						}
						dark = !!snap.dark;
						surface = snap.bg || t['--md-sys-color-surface'] || null;
					} else {
						// No usable snapshot: the first load after this shipped, a
						// cleared cache, or a corrupt/future-versioned record.
						// `theme-bg` is the older background-only key, and mdTheme
						// has always carried the light/dark flag.
						surface = localStorage.getItem('theme-bg');
						try { dark = !!JSON.parse(localStorage.getItem('mdTheme') || '{}').dark; } catch (e) {}
						// Drive the surface TOKEN, not just the element background.
						// --paper reads from this; setting only backgroundColor
						// leaves cards and panels on the light default sitting on a
						// dark page.
						if (surface) root.style.setProperty('--md-sys-color-surface', surface);
					}

					if (surface) {
						root.style.backgroundColor = surface;
						var m = document.querySelector('meta[name="theme-color"]');
						if (m) m.setAttribute('content', surface);
					}

					// `theme-dark` flips --ink to near-white in app.css, so it is
					// only safe once we have a dark surface to put that text on.
					// Applying it on its own — which the first version of this did
					// — renders white text on the cream fallback paper, i.e.
					// invisible. No surface means no claim about dark: stay
					// entirely on the app.css defaults, which are at least
					// self-consistent.
					if (dark !== null && surface) {
						root.classList.toggle('theme-dark', dark);
						root.style.colorScheme = dark ? 'dark' : 'light';
					}
				} catch (e) { /* never let theming break the document */ }
			})();
		</script>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<meta name="apple-mobile-web-app-title" content="eating.computer" />
		<link rel="manifest" href="/manifest.json" />
		<!-- SVG favicon auto-switches light/dark via prefers-color-scheme;
		     PNG fallback for browsers without SVG favicon support. -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- Telegram emoji sprite sheet + its manifest. Browser starts
		     downloading these the instant the HTML is parsed, before any
		     JS runs, so by the time the user opens the picker (or sees
		     [tg:…] tokens in chat) the bytes are already cached. -->
		<link rel="preload" as="image" type="image/webp"
			href="https://pub-62e59b4ebf1d45d2ad5f669369e907fe.r2.dev/telegram-emoji/sprite.webp"
			crossorigin="anonymous" />
		<link rel="preload" as="fetch" type="application/json"
			href="https://pub-62e59b4ebf1d45d2ad5f669369e907fe.r2.dev/telegram-emoji/sprite-manifest.json"
			crossorigin="anonymous" />
		<!-- Material Symbols Rounded — variable font supporting FILL,
		     wght, GRAD, opsz axes. Used app-wide via the `.msi` helper
		     class (or directly with `material-symbols-rounded`). Ligature
		     syntax: <span class="msi">blender</span>. Preconnect to
		     fonts.gstatic.com so the woff2 lands fast on first paint. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Boot loader: the mark with an indeterminate ring around it, covering
		     the gap between the native splash handing over and the app painting.
		     Removed by the app on mount (see the root layout), and self-clears on
		     window load so a failure here can never leave a stuck overlay. -->
		<div id="boot-loader" aria-hidden="true">
			<div class="bl-mark">
				<svg viewBox="0 0 100 100" width="44" height="44" aria-hidden="true">
					<path fill="#00ff00" transform="translate(22.000 78.000) scale(0.100000 -0.100000)"
						d="M320 560 440 520 520 400 480 320 160 240 200 80 320 40 400 80 480 160 520 120 440 40 360 0H240L120 40L40 200V360L120 520L240 560ZM200 480 160 280 360 360V480L280 520Z"/>
				</svg>
				<span class="bl-ring"></span>
			</div>
		</div>
		<style>
			#boot-loader {
				position: fixed; inset: 0; z-index: 99999;
				display: grid; place-items: center;
				background: #000;
			}
			#boot-loader.done { opacity: 0; pointer-events: none; transition: opacity 0.28s ease; }
			.bl-mark { position: relative; display: grid; place-items: center; width: 96px; height: 96px; }
			.bl-mark svg { display: block; }
			/* The ring SURROUNDS the mark rather than sitting on it. */
			.bl-ring {
				position: absolute; inset: 0;
				border-radius: 50%;
				border: 3px solid rgba(0, 255, 0, 0.18);
				border-top-color: #00ff00;
				animation: bl-spin 0.9s linear infinite;
			}
			@keyframes bl-spin { to { transform: rotate(360deg); } }
			@media (prefers-reduced-motion: reduce) { .bl-ring { animation-duration: 2.6s; } }
		</style>
		<script>
			// Safety net: never let the overlay outlive the page load, even if the
			// app never gets far enough to remove it itself.
			addEventListener('load', function () {
				setTimeout(function () {
					var el = document.getElementById('boot-loader');
					if (el) { el.classList.add('done'); setTimeout(function () { el.remove(); }, 320); }
				}, 150);
			});
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
