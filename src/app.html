<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Paint the saved theme background BEFORE first paint so a WebView reload
		     (native app) doesn't flash white/default while the theme CSS + JS load.
		     theme-store.js writes the resolved surface colour to localStorage on
		     every theme apply; we read it back synchronously here. -->
		<script>
			try {
				var __bg = localStorage.getItem('theme-bg');
				if (__bg) document.documentElement.style.backgroundColor = __bg;
			} catch (e) {}
		</script>
		<!--
			`interactive-widget=resizes-content` tells mobile browsers
			to shrink the layout viewport when the on-screen keyboard
			opens. Without it, `position: fixed; bottom: 0` elements
			get pushed BEHIND the keyboard because the layout viewport
			stays at full height while only the visual viewport
			shrinks. With it, the chat compose, bottom nav, etc., float
			just above the keyboard like users expect.
		-->
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<meta name="theme-color" content="#0c0c0c" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<meta name="apple-mobile-web-app-title" content="eating.computer" />
		<link rel="manifest" href="/manifest.json" />
		<!-- SVG favicon auto-switches light/dark via prefers-color-scheme;
		     PNG fallback for browsers without SVG favicon support. -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- Telegram emoji sprite sheet + its manifest. Browser starts
		     downloading these the instant the HTML is parsed, before any
		     JS runs, so by the time the user opens the picker (or sees
		     [tg:…] tokens in chat) the bytes are already cached. -->
		<link rel="preload" as="image" type="image/webp"
			href="https://pub-62e59b4ebf1d45d2ad5f669369e907fe.r2.dev/telegram-emoji/sprite.webp"
			crossorigin="anonymous" />
		<link rel="preload" as="fetch" type="application/json"
			href="https://pub-62e59b4ebf1d45d2ad5f669369e907fe.r2.dev/telegram-emoji/sprite-manifest.json"
			crossorigin="anonymous" />
		<!-- Material Symbols Rounded — variable font supporting FILL,
		     wght, GRAD, opsz axes. Used app-wide via the `.msi` helper
		     class (or directly with `material-symbols-rounded`). Ligature
		     syntax: <span class="msi">blender</span>. Preconnect to
		     fonts.gstatic.com so the woff2 lands fast on first paint. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
